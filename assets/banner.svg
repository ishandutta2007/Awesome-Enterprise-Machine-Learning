<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-canvas { fill: url(#bg-grad); }
    .grid-layer { fill: url(#grid); }
    
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(0.95) translate(25px, -15px); opacity: 0.7; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
    @keyframes pingDot {
      0% { r: 3; opacity: 1; }
      50% { r: 6; opacity: 0.5; }
      100% { r: 3; opacity: 1; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPillRev {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .orb-cyan {
      transform-origin: 200px 100px;
      animation: pulseOrb 9s ease-in-out infinite;
    }
    .orb-purple {
      transform-origin: 1000px 240px;
      animation: pulseOrb2 11s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashMove 14s linear infinite;
    }
    .flow-line-fast {
      stroke-dasharray: 6 10;
      animation: dashMove 8s linear infinite;
    }
    .pulsing-node {
      animation: pingDot 3s ease-in-out infinite;
    }
    .pill-floating {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-floating-rev {
      animation: floatPillRev 6s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .badge-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" class="bg-canvas" />
  
  <!-- Subtle Grid System -->
  <rect width="1200" height="340" rx="16" class="grid-layer" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#soft-glow)">
    <circle cx="180" cy="120" r="140" fill="url(#cyan-glow)" class="orb-cyan" />
    <circle cx="1020" cy="220" r="160" fill="url(#purple-glow)" class="orb-purple" />
    <circle cx="600" cy="280" r="110" fill="#3b82f6" fill-opacity="0.12" />
  </g>

  <!-- Dynamic Circuit / Pipeline Streams in Background Layer -->
  <g opacity="0.6">
    <path d="M -20 180 Q 250 80 500 170 T 950 150 T 1220 200" fill="none" stroke="#0284c7" stroke-width="2.5" class="flow-line" opacity="0.6" />
    <path d="M -20 240 C 300 320 400 130 750 220 C 950 280 1100 140 1220 160" fill="none" stroke="#8b5cf6" stroke-width="2" class="flow-line-fast" opacity="0.55" />
    <path d="M 150 -20 L 250 120 L 420 120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
    <path d="M 1050 360 L 960 220 L 780 220" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
    
    <!-- Flow Nodes -->
    <circle cx="250" cy="120" r="4" fill="#38bdf8" class="pulsing-node" />
    <circle cx="500" cy="170" r="4.5" fill="#818cf8" class="pulsing-node" style="animation-delay: 1s;" />
    <circle cx="950" cy="150" r="4" fill="#c084fc" class="pulsing-node" style="animation-delay: 2s;" />
    <circle cx="750" cy="220" r="4.5" fill="#06b6d4" class="pulsing-node" style="animation-delay: 1.5s;" />
  </g>

  <!-- Floating Feature Pills (Background-Midground Accent, Outside Core Text Safe-Zone) -->
  <g class="pill-floating">
    <rect x="75" y="42" width="130" height="26" rx="13" fill="#0f172a" stroke="#0284c7" stroke-opacity="0.7" stroke-width="1.2" />
    <circle cx="90" cy="55" r="4" fill="#38bdf8" />
    <text x="103" y="59" fill="#93c5fd" class="badge-label">⚡ MLOps</text>
  </g>
  <g class="pill-floating-rev">
    <rect x="990" y="42" width="135" height="26" rx="13" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.2" />
    <circle cx="1005" cy="55" r="4" fill="#a855f7" />
    <text x="1018" y="59" fill="#d8b4fe" class="badge-label">🤖 LLMOps</text>
  </g>
  <g class="pill-floating">
    <rect x="65" y="270" width="145" height="26" rx="13" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="80" cy="283" r="4" fill="#60a5fa" />
    <text x="93" y="287" fill="#bfdbfe" class="badge-label">✨ AutoML 2.0</text>
  </g>
  <g class="pill-floating-rev">
    <rect x="980" y="270" width="150" height="26" rx="13" fill="#0f172a" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="995" cy="283" r="4" fill="#34d399" />
    <text x="1008" y="287" fill="#a7f3d0" class="badge-label">🛡️ Governance</text>
  </g>

  <!-- Dark Translucent Shield for Title Readability (Guarantees Sharp Contrast) -->
  <rect x="180" y="70" width="840" height="195" rx="20" fill="#090d19" fill-opacity="0.78" stroke="#1e293b" stroke-width="1.2" />

  <!-- Core Content (Foreground) -->
  <g id="title-foreground">
    <!-- Top Super-header tag -->
    <rect x="475" y="90" width="250" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="490" cy="103" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="502" y="107" fill="#c7d2fe" class="badge-label" letter-spacing="1">ENTERPRISE ML ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-size="44" fill="url(#title-grad)" class="title-text" filter="url(#neon-glow)">
      Awesome Enterprise Machine Learning
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" text-anchor="middle" font-size="16.5" fill="#cbd5e1" class="sub-text">
      Production MLOps • Foundation Model Lifecycle • High-Performance Serving &amp; AutoML
    </text>

    <!-- Meta Tech Pills / Ecosystem Focus -->
    <text x="600" y="238" text-anchor="middle" font-size="13" fill="#64748b" class="badge-label">
      CURATED DIRECTORY OF LEADING SAAS PLATFORMS &amp; BATTLE-TESTED OPEN-SOURCE TOOLS
    </text>
  </g>
</svg>
